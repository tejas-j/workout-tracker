name = "workout-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
FIREBASE_PROJECT_ID = "workout-tracker-67216"
# Sites allowed to call this proxy (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://train.tejasrj.io,http://localhost:8000"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Daily request limits per tier (days reset at midnight Pacific time).
LIMIT_OWNER = "100"
LIMIT_MEMBER = "20"
LIMIT_MEMBER_TOTAL = "150"
LIMIT_PUBLIC_PER_IP = "5"
LIMIT_PUBLIC_TOTAL = "50"

# Daily usage counters, kept in a Durable Object so counts are exact.
[[durable_objects.bindings]]
name = "USAGE_COUNTER"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# Secrets are never stored in this file. Set them with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OWNER_EMAILS     (comma-separated Google account emails)
